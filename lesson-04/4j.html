<!doctype html>
<html lang="en">
  <head>
    <title>JavaScript</title>
    <style>
      .orange-button {
        background-color: orange;
      }
      .yellow-button {
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <p>Adults Plain Cotton T-shirt</p>
    <p>Price: $7.99</p>
    <button class="yellow-button" onclick="alert('Added')">Add to Cart</button>
    <button
      class="orange-button"
      onclick="
        console.log('Loading...');
        alert('Purchased');
      "
    >
      Buy Now
    </button>
  </body>
</html>
