<!doctype html>
<html lang="en">
  <head> </head>
  <body>
    <script>
      function greet(name) {
        if (!name) {
          console.log('Hello there!');
        } else {
          console.log(`Hello, ${name}!`);
        }
      }
      greet('Ayan');
      greet('Khan');
      greet();
    </script>
  </body>
</html>
