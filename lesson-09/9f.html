<!doctype html>
<html>
  <head></head>
  <body>
    <input placeholder="Enter your name" onkeydown="displayNameOnEnter()" />
    <button onclick="displayName()">Submit</button>
    <p></p>
    <script>
      function displayName() {
        document.querySelector('p').innerHTML =
          `Your name is: ${document.querySelector('input').value}`;
      }

      function displayNameOnEnter() {
        if (event.key === 'Enter') {
          document.querySelector('p').innerHTML =
            `Your name is: ${document.querySelector('input').value}`;
        }
      }
    </script>
  </body>
</html>
