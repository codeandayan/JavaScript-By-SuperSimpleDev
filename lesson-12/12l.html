<!doctype html>
<html lang="en">
  <head>
    <title>Advanced Functions</title>
  </head>
  <body>
    <script>
      function countPositive(nums) {
        let count = 0;
        nums.forEach((num) => {
          if (num >= 0) {
            count++;
          }
        });
        return count;
      }
      console.log(countPositive([1, -3, 5]));
      console.log(countPositive([1, -3, 5, 4, 6, -4, 9]));
    </script>
  </body>
</html>
