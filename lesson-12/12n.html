<!doctype html>
<html lang="en">
  <head>
    <title>Advanced Functions</title>
  </head>
  <body>
    <script>
      function removeEgg(foods) {
        return foods.filter((food) => food !== 'egg');
      }

      console.log(removeEgg(['apple', 'egg', 'bread', 'egg', 'milk']));
    </script>
  </body>
</html>
